name: Deploy Lab Guide

on:
  push:
    branches: [main]
    paths:
      - "guide/**"
      - "hooks/**"
      - "labs/*/questions.json"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  # Build on the PR too so a broken link fails review, not the deploy.
  # Keep these paths in step with the push filter above.
  pull_request:
    branches: [main]
    paths:
      - "guide/**"
      - "hooks/**"
      - "labs/*/questions.json"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - run: pip install mkdocs-material==9.7.6 mkdocs-glightbox==0.5.3

      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the built site to GitHub Pages
      id-token: write # OIDC token deploy-pages uses to verify the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
